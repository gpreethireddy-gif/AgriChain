<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Orders - AgriChain</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .orders-section {
            min-height: calc(100vh - 70px);
            padding: 50px 8%;
            background: #f4f7f4;
        }

        .orders-container {
            max-width: 1100px;
            margin: auto;
        }

        .orders-container h1 {
            color: #1f5f25;
            margin-bottom: 8px;
        }

        .orders-subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .order-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 18px;
        }

        .order-id {
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }

        .order-date {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .buyer-name {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 12px;
        }

        .product-row {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            font-weight: bold;
            color: #333;
        }

        .product-details {
            color: #555;
            margin-top: 5px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .order-total {
            font-size: 19px;
            font-weight: bold;
            color: #1f5f25;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .confirm-btn {
            padding: 11px 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .confirm-btn:hover {
            background: #256628;
        }

        .complete-btn {
            padding: 11px 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .complete-btn:hover {
            background: #0d47a1;
        }

        .cancel-order-btn {
            padding: 11px 20px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-order-btn:hover {
            background: #a51f1f;
        }

        .empty-orders {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 18px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #256628;
        }

        .refresh-btn {
            margin-bottom: 25px;
            margin-left: 8px;
            padding: 10px 18px;
            background: white;
            color: #2e7d32;
            border: 1px solid #2e7d32;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background: #f0f7f0;
        }

        @media (max-width: 768px) {

            .orders-section {
                padding: 35px 20px;
            }

            .order-header,
            .order-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .action-buttons {
                width: 100%;
            }

            .action-buttons button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🌾 AgriChain
        </div>

        <ul class="nav-links">

            <li>
                <a href="farmer.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="farmer-orders.html">
                    Orders
                </a>
            </li>

            <li>
                <a href="#" onclick="logout()">
                    Logout
                </a>
            </li>

        </ul>

    </nav>


    <!-- ORDERS -->

    <section class="orders-section">

        <div class="orders-container">

            <a href="farmer.html" class="back-btn">
                ← Back to Dashboard
            </a>

            <button
                class="refresh-btn"
                onclick="loadOrders()">

                🔄 Refresh Orders

            </button>

            <h1>
                Incoming Orders
            </h1>

            <p class="orders-subtitle">
                View orders placed for your products and manage their status.
            </p>

            <div id="ordersContainer">

                <div class="empty-orders">
                    Loading orders...
                </div>

            </div>

        </div>

    </section>


    <script>

        // ==========================================
        // CHECK LOGIN
        // ==========================================

        const userData =
            localStorage.getItem("user");

        if (!userData) {

            alert("Please login first.");

            window.location.href =
                "login.html";

        }

        const user =
            JSON.parse(userData);


        // ==========================================
        // LOAD ORDERS
        // ==========================================

        async function loadOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );

            container.innerHTML = `
                <div class="empty-orders">
                    Loading orders...
                </div>
            `;

            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/orders/all"
                    );

                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load orders."
                    );

                }


                let orders =
                    data.orders || [];


                // ==========================================
                // SHOW ONLY THIS FARMER'S PRODUCTS
                // ==========================================

                orders =
                    orders.filter(order => {

                        return order.products.some(
                            product =>
                                String(product.farmerId) ===
                                String(user.id)
                        );

                    });


                // ==========================================
                // NO ORDERS
                // ==========================================

                if (orders.length === 0) {

                    container.innerHTML = `

                        <div class="empty-orders">

                            <h2>
                                No Incoming Orders
                            </h2>

                            <p>
                                There are no orders for your
                                products yet.
                            </p>

                        </div>

                    `;

                    return;

                }


                container.innerHTML = "";


                // ==========================================
                // DISPLAY EACH ORDER
                // ==========================================

                orders.forEach(order => {

                    let productsHTML = "";


                    order.products.forEach(
                        product => {

                            // Only show this farmer's products

                            if (
                                String(product.farmerId) !==
                                String(user.id)
                            ) {
                                return;
                            }


                            productsHTML += `

                                <div class="product-row">

                                    <div class="product-name">

                                        🌾
                                        ${product.productName}

                                    </div>

                                    <div class="product-details">

                                        Quantity:
                                        ${product.quantity}
                                        ${product.unit}

                                        <br>

                                        Price:
                                        ₹${Number(
                                            product.price
                                        ).toFixed(2)}

                                    </div>

                                </div>

                            `;

                        }
                    );


                    // ==========================================
                    // STATUS CLASS
                    // ==========================================

                    const statusClass =
                        "status-" +
                        order.status.toLowerCase();


                    // ==========================================
                    // ORDER DATE
                    // ==========================================

                    const orderDate =
                        new Date(
                            order.createdAt
                        ).toLocaleString();


                    // ==========================================
                    // ACTION BUTTONS
                    // ==========================================

                    let actionButtons = "";


                    // PENDING

                    if (
                        order.status ===
                        "Pending"
                    ) {

                        actionButtons = `

                            <button
                                class="confirm-btn"
                                onclick="confirmOrder(
                                    '${order._id}'
                                )">

                                ✅ Confirm Order

                            </button>


                            <button
                                class="cancel-order-btn"
                                onclick="cancelOrder(
                                    '${order._id}'
                                )">

                                ❌ Cancel

                            </button>

                        `;

                    }


                    // CONFIRMED

                    else if (
                        order.status ===
                        "Confirmed"
                    ) {

                        actionButtons = `

                            <button
                                class="complete-btn"
                                onclick="completeOrder(
                                    '${order._id}'
                                )">

                                ✔️ Mark Completed

                            </button>


                            <button
                                class="cancel-order-btn"
                                onclick="cancelOrder(
                                    '${order._id}'
                                )">

                                ❌ Cancel

                            </button>

                        `;

                    }


                    // COMPLETED

                    else if (
                        order.status ===
                        "Completed"
                    ) {

                        actionButtons = `

                            <span class="
                                status
                                status-completed
                            ">

                                ✔️ Completed

                            </span>

                        `;

                    }


                    // CANCELLED

                    else if (
                        order.status ===
                        "Cancelled"
                    ) {

                        actionButtons = `

                            <span class="
                                status
                                status-cancelled
                            ">

                                ❌ Cancelled

                            </span>

                        `;

                    }


                    // ==========================================
                    // ADD ORDER CARD
                    // ==========================================

                    container.innerHTML += `

                        <div class="order-card">

                            <div class="order-header">

                                <div>

                                    <div class="order-id">

                                        Order ID:
                                        ${order._id}

                                    </div>

                                    <div class="order-date">

                                        ${orderDate}

                                    </div>

                                </div>


                                <span class="
                                    status
                                    ${statusClass}
                                ">

                                    ${order.status}

                                </span>

                            </div>


                            <div class="buyer-name">

                                👤 Buyer:
                                ${order.buyerName}

                            </div>


                            ${productsHTML}


                            <div class="order-footer">

                                <div class="order-total">

                                    Total:
                                    ₹${Number(
                                        order.totalAmount
                                    ).toFixed(2)}

                                </div>


                                <div class="action-buttons">

                                    ${actionButtons}

                                </div>

                            </div>

                        </div>

                    `;

                });


            }

            catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="empty-orders">

                        <h2>
                            Unable to Load Orders
                        </h2>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }

        }


        // ==========================================
        // CONFIRM ORDER
        // ==========================================

        async function confirmOrder(orderId) {

            const confirmAction =
                confirm(
                    "Are you sure you want to confirm this order?"
                );


            if (!confirmAction) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `http://localhost:5000/api/orders/confirm/${orderId}`,
                        {
                            method: "PUT"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to confirm order."
                    );

                }


                alert(
                    "Order confirmed successfully!"
                );


                loadOrders();

            }

            catch (error) {

                console.error(error);

                alert(error.message);

            }

        }


        // ==========================================
        // COMPLETE ORDER
        // ==========================================

        async function completeOrder(orderId) {

            const confirmAction =
                confirm(
                    "Are you sure you want to mark this order as completed?"
                );


            if (!confirmAction) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `http://localhost:5000/api/orders/complete/${orderId}`,
                        {
                            method: "PUT"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to complete order."
                    );

                }


                alert(
                    "Order completed successfully!"
                );


                loadOrders();

            }

            catch (error) {

                console.error(error);

                alert(error.message);

            }

        }


        // ==========================================
        // CANCEL ORDER
        // ==========================================

        async function cancelOrder(orderId) {

            const confirmAction =
                confirm(
                    "Are you sure you want to cancel this order?"
                );


            if (!confirmAction) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `http://localhost:5000/api/orders/cancel/${orderId}`,
                        {
                            method: "PUT"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to cancel order."
                    );

                }


                alert(
                    "Order cancelled successfully!"
                );


                loadOrders();

            }

            catch (error) {

                console.error(error);

                alert(error.message);

            }

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            localStorage.removeItem(
                "user"
            );

            localStorage.removeItem(
                "cart"
            );

            window.location.href =
                "login.html";

        }


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        loadOrders();

    </script>

</body>

</html>
